<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyst Toolkit</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Data Analyst Portal</h1>
      <p>Upload a CSV to inspect data profiling and instant aggregations.</p>
    </header>

    <section class="upload-card">
      <input type="file" id="csvFileInput" accept=".csv">
      <button id="uploadBtn">Analyze Dataset</button>
      <span id="loading" class="hidden">Processing...</span>
    </section>

    <section id="metricsSection" class="hidden">
      <div class="kpi-grid">
        <div class="card"><h3>Total Rows</h3><p id="rowCount">-</p></div>
        <div class="card"><h3>Total Columns</h3><p id="colCount">-</p></div>
      </div>

      <div class="card table-container">
        <h3>Data Preview (First 5 Rows)</h3>
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="card chart-box">
        <h3>Numeric Distribution</h3>
        <canvas id="analyticsChart"></canvas>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
